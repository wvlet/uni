appId: org.wvlet.uni.example.counter
productName: Uni Counter
directories:
  output: dist
  buildResources: build
compression: maximum
# Ship only the UI languages the app supports; Chromium otherwise bundles every locale.
electronLanguages:
  - en
files:
  - out/**/*
  - package.json
mac:
  target: dmg
win:
  target: nsis
linux:
  target: AppImage
