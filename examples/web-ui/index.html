<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Uni Todo</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #f4f4f5; margin: 0; }
      .todo-app { max-width: 28rem; margin: 3rem auto; padding: 1.5rem; background: white; border-radius: 0.75rem; box-shadow: 0 1px 4px rgb(0 0 0 / 0.1); }
      form { display: flex; gap: 0.5rem; }
      form input { flex: 1; padding: 0.4rem; }
      ul { list-style: none; padding: 0; }
      li { display: flex; align-items: center; gap: 0.5rem; padding: 0.3rem 0; }
      li span { flex: 1; }
      li.done span { text-decoration: line-through; color: #a1a1aa; }
      .summary { color: #71717a; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!-- Built by `./sbt exampleWebUi/fastLinkJS` -->
    <script type="module" src="target/js/main.js"></script>
  </body>
</html>
