appId: org.wvlet.uni.example.harness
productName: Uni Harness
directories:
  output: dist
  buildResources: build
compression: maximum
# Ship only the UI languages the app supports; Chromium otherwise bundles every locale.
electronLanguages:
  - en
files:
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
  - package.json
  # node-pty ships prebuilds for every platform; keep only the one for this build's target. The app
  # loads the build/Release binary electron-builder compiles for Electron first, and falls back to it.
  - '!node_modules/node-pty/prebuilds/!(${platform}-${arch})/**'
mac:
  target: dmg
win:
  target: nsis
linux:
  target: AppImage
