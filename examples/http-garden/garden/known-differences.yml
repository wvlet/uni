- server: uni_netty
  payload: 'POST /size-space HTTP/1.1\r\nHost: localhost\r\nTransfer-Encoding: chunked\r\n\r\n5 \r\nhello\r\n0\r\n\r\n'
  reason: Netty 4.2.21, which uni-netty uses, rejects whitespace after the chunk size, which RFC 9112 allows only before ';'; Garden's pinned Netty accepts it. A rejection cannot desynchronize a proxy in front of it
- server: uni_netty
