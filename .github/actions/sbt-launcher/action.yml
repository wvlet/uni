name: Cache the sbt launcher and sbt itself
description: >-
  Restore ~/.sbt/launchers and ~/.sbt/boot, so ./sbt doesn't download the launcher, or the sbt
  version it boots, from Maven Central in every job. Maven Central sometimes stalls on those
  requests for minutes or answers HTTP 429, which failed CI jobs even with ./sbt's retries.
  setup-java's sbt cache doesn't keep the launchers, and its key changes with every build.sbt
  edit, so it misses on pull requests that change the build.
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: |
          ~/.sbt/launchers
          ~/.sbt/boot
          !~/.sbt/boot/sbt.boot.lock
        # The launcher and sbt versions follow sbt.version in project/build.properties
        key: sbt-boot-${{ runner.os }}-${{ hashFiles('project/build.properties') }}
