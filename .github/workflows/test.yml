name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      src: ${{ steps.filter.outputs.src }}
      native: ${{ steps.filter.outputs.native }}
      lean: ${{ steps.filter.outputs.lean }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # Building Scala Native on Windows costs ~15 minutes, mostly toolchain setup, so the
            # Windows job sits behind this narrower filter: the C sources Scala Native compiles into
            # every downstream binary, the Native-only Scala, and the Scala Native version itself.
            # It also covers shared code that starts processes or branches on Windows, since Scala
            # Native's Windows process launching differs from the JVM's (#1046).
            native:
              - '.github/workflows/test.yml'
              - '**.c'
              - '**/.native/**'
              - 'project/**'
              - 'uni-core/src/main/scala/wvlet/uni/io/IO.scala'
              - 'uni-core/src/main/scala/wvlet/uni/io/IOPath.scala'
              - 'uni/.jvm-native/src/main/scala/wvlet/uni/storage/StorageEnv.scala'
              - 'uni/src/main/scala/wvlet/uni/storage/AwsProfiles.scala'
              - 'uni/src/test/scala/wvlet/uni/storage/AwsProfileCredentialsTest.scala'
            # The Lean spec and the Scala cases generated from it (see spec/lean/README.md)
            lean:
              - '.github/workflows/test.yml'
              - 'spec/lean/**'
              - 'uni/src/test/scala/wvlet/uni/rx/RxSpecCases.scala'
              - 'uni/src/test/scala/wvlet/uni/msgpack/spi/MsgPackSpecCases.scala'
              - 'uni/src/test/scala/wvlet/uni/rx/RxNestedSpecCases.scala'
              - 'uni/src/test/scala/wvlet/uni/rx/RxRecoverSpecCases.scala'
              - 'uni/src/test/scala/wvlet/uni/rx/RxLiveSpecCases.scala'
              - 'uni/.jvm-native/src/test/scala/wvlet/uni/http/HttpReaderSpecCases.scala'
              - 'uni-dom-test/src/test/scala/wvlet/uni/dom/DomRenderSpecCases.scala'
            src:
              - '.github/workflows/test.yml'
              - '.github/scripts/**'
              - 'project/**'
              - '**.scala'
              - '**.sbt'
              - '**.c'
              - '**.conf'
              - '**.json'
              - '**.js'
              - '**.html'
              - '**.css'
              - '**.ts'
              - 'pnpm-lock.yaml'
              - SCALA_VERSION
              # The docSnippets project compiles the skill's Markdown snippets (projectJVM/test)
              - 'plugins/uni/skills/**'
              # docSnippetsJS compiles the UI pages' snippets (projectJS/test)
              - 'docs/dom/**'
              # The npm package: its type declarations, README, and smoke test
              - 'uni-npm/**'
  lean_spec:
    name: Lean spec
    needs: changes
    if: ${{ needs.changes.outputs.lean == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spec/lean
    steps:
      - uses: actions/checkout@v7
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # Builds the model, which checks every proof, and the case generator
      - name: Check proofs
        run: lake build
      - name: Generated cases are up to date
        run: |
          lake exe gen-rx-cases
          lake exe gen-msgpack-cases
          lake exe gen-rx-nested-cases
          lake exe gen-rx-recover-cases
          lake exe gen-http-reader-cases
          lake exe gen-rx-live-cases
          lake exe gen-dom-render-cases
          if ! git diff --exit-code -- ../../uni/src/test/scala ../../uni/.jvm-native/src/test/scala ../../uni-dom-test/src/test/scala; then
            echo "::error::Run the gen-* executables in spec/lean (see spec/lean/README.md) and commit the generated cases"
            exit 1
          fi
  code_format:
    name: Code format
    needs: changes
    if: ${{ needs.changes.outputs.src == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: sbt
      - uses: ./.github/actions/sbt-launcher
      - name: scalafmt
        run: ./sbt "scalafmtCheckAll; scalafmtSbtCheck"
      # Test bodies use braces: `test("name") { ... }`. scalafmt cannot rewrite the colon form
      # `test("name"):` back to braces, so reject it here (plans/ keeps historical notes as-is).
      - name: Brace-style test blocks
        run: |
          if git grep -nE '^[[:space:]]*(\*[[:space:]]*)?test\(.*\):[[:space:]]*(//.*)?$' -- '*.scala' '*.md' ':!plans/'; then
            echo "::error::Write tests as test(\"...\") { ... } instead of test(\"...\"):"
            exit 1
          fi
      # The sbt plugins are a separate build in sbt-plugins/, which the root scalafmtCheckAll never
      # sees. Their scripted-test jobs are not required status checks, so a scalafmt bump could
      # auto-merge with unformatted plugin code and leave main red (#654, #655). Check them here,
      # inside the required Code format check.
      - name: scalafmt (sbt-plugins build)
        run: (cd sbt-plugins && ../sbt "scalafmtCheckAll; scalafmtSbtCheck")
      # The electron-app example is a standalone sbt build too, with its own .scalafmt.conf
      # symlink; the root scalafmtCheckAll never sees it. Check it here so the required Code
      # format check covers the example as well.
      - name: scalafmt (electron-app example)
        run: (cd examples/electron-app && ../../sbt scalafmtCheckAll)
  test_scala_3:
    name: Scala 3
    needs: changes
    if: ${{ needs.changes.outputs.src == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: sbt
      - uses: ./.github/actions/sbt-launcher
      # An S3-compatible server for the wvlet.uni.storage and Parquet S3 integration tests.
      # Versity S3 Gateway verifies SigV4 signatures and stores buckets as directories. MinIO
      # no longer publishes community binaries or images, so it is not used here.
      - name: Start S3 gateway
        env:
          VGW_VERSION: v1.11.0
          VGW_SHA256: 1f075c9dc92fef232f5b3c7465711ddc5e1b062b2b6df4a3bd246a4be5b35b52
        run: |
          curl -sSfL -o /tmp/vgw.tar.gz "https://github.com/versity/versitygw/releases/download/${VGW_VERSION}/versitygw_${VGW_VERSION}_Linux_x86_64.tar.gz"
          echo "${VGW_SHA256}  /tmp/vgw.tar.gz" | sha256sum -c -
          mkdir -p /tmp/vgw && tar xzf /tmp/vgw.tar.gz -C /tmp/vgw --strip-components=1
          mkdir -p /tmp/vgw-data/uni-test
          ROOT_ACCESS_KEY=uni-test-key ROOT_SECRET_KEY=uni-test-secret \
            nohup /tmp/vgw/versitygw --port 127.0.0.1:7070 posix /tmp/vgw-data > /tmp/vgw.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:7070/ && exit 0; sleep 1; done
          cat /tmp/vgw.log; exit 1
      # A GCS emulator for the native Google Cloud Storage and Parquet GCS integration tests. It
      # checks no credentials (GoogleOAuthJvmTest covers OAuth); -public-host and -external-url
      # make resumable upload session URIs point back at it.
      - name: Start GCS emulator
        env:
          FGCS_VERSION: 1.56.1
          FGCS_SHA256: 0f2f9f6884417acd5cc27126a9aa237ccc627372a4aa5008b399641de6db9469
        run: |
          curl -sSfL -o /tmp/fgcs.tar.gz "https://github.com/fsouza/fake-gcs-server/releases/download/v${FGCS_VERSION}/fake-gcs-server_${FGCS_VERSION}_Linux_amd64.tar.gz"
          echo "${FGCS_SHA256}  /tmp/fgcs.tar.gz" | sha256sum -c -
          mkdir -p /tmp/fgcs /tmp/fgcs-data/uni-test && tar xzf /tmp/fgcs.tar.gz -C /tmp/fgcs
          nohup /tmp/fgcs/fake-gcs-server -scheme http -host 127.0.0.1 -port 4443 \
            -public-host 127.0.0.1:4443 -external-url http://127.0.0.1:4443 \
            -backend memory -data /tmp/fgcs-data > /tmp/fgcs.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:4443/storage/v1/b && exit 0; sleep 1; done
          cat /tmp/fgcs.log; exit 1
      # Azurite, Microsoft's Azure Storage emulator, for the Azure Blob integration tests. It
      # verifies Shared Key and SAS signatures. The official image is pinned by digest.
      - name: Start Azurite
        env:
          AZURITE_IMAGE: mcr.microsoft.com/azure-storage/azurite:3.38.0@sha256:c26024d62bf4a5b88a40968afd217234c00e1fc9a4790dc6105d1ca7979f6eec
        run: |
          docker run -d --name azurite -p 127.0.0.1:10000:10000 "${AZURITE_IMAGE}" \
            azurite-blob --location /data --blobHost 0.0.0.0 --blobPort 10000
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:10000/ && exit 0; sleep 1; done
          docker logs azurite; exit 1
      - name: Scala 3.x test
        env:
          UNI_AZURE_TEST_CONNECTION_STRING: UseDevelopmentStorage=true
          UNI_AZURE_TEST_CONTAINER: uni-test
          UNI_S3_TEST_ENDPOINT: http://127.0.0.1:7070
          UNI_S3_TEST_ACCESS_KEY: uni-test-key
          UNI_S3_TEST_SECRET_KEY: uni-test-secret
          UNI_S3_TEST_BUCKET: uni-test
          UNI_GCS_TEST_ENDPOINT: http://127.0.0.1:4443
          UNI_GCS_TEST_BUCKET: uni-test
        run: JVM_OPTS="-Xms2g -Xmx4g" ./sbt "projectJVM/test"
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always() # always run even if the previous step fails
        with:
          report_paths: '**/target/test-reports/TEST-*.xml'
          check_name: Test Report Scala 3.x
          annotate_only: true
          detailed_summary: true
  test_js:
    name: Scala.js
    needs: changes
    if: ${{ needs.changes.outputs.src == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: ./.github/actions/sbt-launcher
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true
          cache: 'pnpm'
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      # uni-dom-test runs in a real headless Chromium via Playwright (replaces jsdom, so ES
      # modules work). Pin to the same version as the Java Playwright runtime (1.49.0) so the
      # installed Chromium build matches what com.microsoft.playwright expects, and pull in the
      # OS-level libraries Chromium needs on the runner.
      - name: Install Playwright Chromium
        run: pnpm dlx playwright@1.49.0 install --with-deps chromium
      - name: Scala.js test
        run: NODE_OPTIONS=--max-old-space-size=4096 JVM_OPTS=-Xmx4g ./sbt "projectJS/test"
      # Builds @wvlet/uni as the release workflow publishes it, then tests the packed tarball from
      # Node and type-checks a TS consumer against its declarations
      - name: npm package check
        run: |
          JVM_OPTS=-Xmx4g ./sbt "npm/npmPackage"
          uni-npm/npm-test/run.sh uni-npm/target/npm
      # On failure, keep Playwright screenshots (actual/diff images, failure traces) and any golden
      # images written for a missing golden, so they can be inspected or committed.
      # The artifact also holds the committed goldens; list the newly written ones.
      - name: List new golden images
        if: failure()
        run: git status --porcelain --untracked-files=all uni-dom-test/src/test/screenshots uni-ui/src/test/screenshots
      - name: Upload Playwright screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-screenshots
          path: |
            **/uni-playwright/**
            uni-dom-test/src/test/screenshots/
            uni-ui/src/test/screenshots/
          if-no-files-found: ignore
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always() # always run even if the previous step fails
        with:
          report_paths: '**/target/test-reports/TEST-*.xml'
          check_name: Test Report Scala.js
          annotate_only: true
          detailed_summary: true
  test_native_3:
    name: Scala Native
    needs: changes
    if: ${{ needs.changes.outputs.src == 'true' }}
    runs-on: ubuntu-latest
    # A hung test binary otherwise holds the runner for the default 6 hours (one did on Windows)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: ./.github/actions/sbt-launcher
      - name: Install libcurl
        # libgc: examples/rpc-native links the Boehm GC
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libgc-dev
      - name: Scala Native test
        run: JVM_OPTS=-Xmx4g ./sbt "projectNative/test" "exampleRpcNativeNative/nativeLink"
      - name: Run the rpc-native example binary
        run: .github/scripts/check-rpc-native.sh
      # This build passes -lcurl unconditionally, so no Scala Native job here — on any OS — can
      # notice uni_curl_shim.c growing a reference to a libcurl symbol. Downstream projects that
      # never link libcurl can, and their build breaks (issue #622). Check the object directly.
      - name: Assert the curl shim references no libcurl symbol
        run: .github/scripts/check-curl-shim.sh
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always() # always run even if the previous step fails
        with:
          report_paths: '**/target/test-reports/TEST-*.xml'
          check_name: Test Report Scala Native
          annotate_only: true
          detailed_summary: true
  test_native_3_windows:
    # Scala Native compiles every .c under resources/scala-native/ from every jar on the classpath, so
    # uni's C (uni_curl_shim.c, uni_socket_shim.c) lands in each downstream Windows binary — including
    # ones that never call curl or open a socket. uni had no Windows Native build, so v2026.1.17
    # shipped a POSIX-only `#include <dlfcn.h>` and broke those consumers rather than this repo's CI.
    name: Scala Native (Windows)
    needs: changes
    # ~15 minutes, nearly all of it toolchain setup, so don't spend it on every PR: run it on every
    # push to main, and on the pull requests that can actually break it — those touching native code.
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.native == 'true' }}
    runs-on: windows-latest
    # A hung test binary otherwise holds the runner for the default 6 hours (one did on Windows)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: ./.github/actions/sbt-launcher
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install LLVM
        # The runner image preinstalls an LLVM that can lag behind its MSVC STL (image 20261116 paired
        # LLVM 20 with STL 14.52, which requires Clang 22+), and `choco install` skips a package that is
        # already installed. `upgrade` installs it when missing and moves it to the latest otherwise.
        run: |
          choco upgrade llvm -y
          clang --version
        shell: pwsh
      - name: Cache vcpkg artifacts
        uses: actions/cache@v6
        id: vcpkg-cache
        with:
          path: C:\vcpkg\installed
          key: vcpkg-windows-x64-curl-zlib-openssl-v2
      - name: Install libcurl, zlib and OpenSSL
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: vcpkg install curl:x64-windows zlib:x64-windows openssl:x64-windows
        shell: pwsh
      - name: Expose the native libraries to the compiler, the linker and the test binary
        # Each `-lfoo` / @link("foo") reaches clang in MSVC mode as a request for `foo.lib`:
        # `-lcurl -lz` from this build, and `-lcrypto -lssl -lzlib` from Scala Native's own javalib
        # (zlib under both names). vcpkg installs the import libraries under their upstream names,
        # which vary by port revision, so for each name asked for take the first candidate that exists.
        run: |
          $root   = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          $libDir = "$root\lib"
          $wanted = [ordered]@{
            "curl.lib"   = @("libcurl.lib")
            "crypto.lib" = @("libcrypto.lib")
            "ssl.lib"    = @("libssl.lib")
            "z.lib"      = @("zlib.lib", "zlib1.lib", "libz.lib")
            "zlib.lib"   = @("z.lib", "zlib1.lib", "libz.lib")
          }
          foreach ($dst in $wanted.Keys) {
            $dstPath = Join-Path $libDir $dst
            if (Test-Path $dstPath) { continue }
            foreach ($src in $wanted[$dst]) {
              $srcPath = Join-Path $libDir $src
              if (Test-Path $srcPath) {
                Write-Host "Copying $src -> $dst"
                Copy-Item $srcPath $dstPath -Force
                break
              }
            }
            if (-not (Test-Path $dstPath)) { Write-Host "WARNING: no candidate found for $dst" }
          }
          Get-ChildItem $libDir -Filter *.lib | Select-Object -ExpandProperty Name | Sort-Object
          # Scala Native's own javalib ships a z.c that includes <zlib.h>, so the headers must be
          # reachable too, not just the import libraries.
          echo "C_INCLUDE_PATH=$root\include" >> $env:GITHUB_ENV
          echo "INCLUDE=$root\include;$env:INCLUDE" >> $env:GITHUB_ENV
          # LIB is where lld-link searches; bin is where the linked test binary finds libcurl.dll.
          echo "LIB=$libDir;$env:LIB" >> $env:GITHUB_ENV
          echo "$root\bin" >> $env:GITHUB_PATH
        shell: pwsh
      # Exercises uni_socket_shim.c (WSAStartup / WSAPoll / closesocket) and uni_curl_shim.c
      # (GetProcAddress over EnumProcessModules) at runtime, not merely at compile time.
      - name: Scala Native test
        run: JVM_OPTS=-Xmx4g ./sbt "projectNative/test"
        shell: bash
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always() # always run even if the previous step fails
        with:
          report_paths: '**/target/test-reports/TEST-*.xml'
          check_name: Test Report Scala Native (Windows)
          annotate_only: true
          detailed_summary: true
  package_src:
    name: Verify packageSrc
    needs: changes
    if: ${{ needs.changes.outputs.src == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: ./.github/actions/sbt-launcher
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true
          cache: 'pnpm'
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Install libcurl
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Verify packageSrc (detect cross-platform class name conflicts)
        run: ./sbt "projectJVM/packageSrc" "projectJS/packageSrc" "projectNative/packageSrc"
  test_sbt_plugin:
    name: sbt plugin scripted test
    needs: changes
    if: ${{ needs.changes.outputs.src == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: sbt
      - uses: ./.github/actions/sbt-launcher
      - name: Install sbt
        uses: sbt/setup-sbt@v1
      - name: Publish uni locally and get version
        id: publish
        run: |
          ./sbt "coreJVM/publishLocal; uniJVM/publishLocal"
          UNI_VERSION=$(./sbt "print uniJVM/version" 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' | grep -E '^[0-9]' | tail -1 | tr -d '[:space:]')
          echo "UNI_VERSION=${UNI_VERSION}"
          echo "UNI_VERSION=${UNI_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Build and test sbt plugin
        working-directory: sbt-plugins
        run: |
          echo "Using UNI_VERSION=${{ steps.publish.outputs.UNI_VERSION }}"
          UNI_VERSION=${{ steps.publish.outputs.UNI_VERSION }} sbt "sbtUni/publishLocal; sbtUni/scripted"
  test_sbt_uni_playwright:
    name: sbt-uni-playwright scripted test
    needs: changes
    if: ${{ needs.changes.outputs.src == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: sbt
      - uses: ./.github/actions/sbt-launcher
      - name: Install sbt
        uses: sbt/setup-sbt@v1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true
      # The scripted test downloads Chromium via the Java Playwright runtime, which needs the
      # OS-level libraries. Pin to the same version as the Playwright runtime so the cached build
      # matches; --with-deps also installs those libraries.
      - name: Install Playwright Chromium
        run: pnpm dlx playwright@1.49.0 install --with-deps chromium
      - name: Build and scripted-test the plugin (runs Scala.js tests in headless Chromium)
        working-directory: sbt-plugins
        run: sbt "jsenv/publishLocal; sbtUniPlaywright/publishLocal; sbtUniPlaywright/scripted"
  test_sbt_uni_crossproject:
    name: sbt-uni-crossproject scripted test
    needs: changes
    if: ${{ needs.changes.outputs.src == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: sbt
      - uses: ./.github/actions/sbt-launcher
      - name: Install sbt
        uses: sbt/setup-sbt@v1
      # The scripted test cross-compiles for JVM, Scala.js, and Scala Native. It only compiles the
      # Native sources to NIR (no nativeLink/run), so no clang/LLVM toolchain or Node.js is needed.
      - name: Build and scripted-test the plugin
        working-directory: sbt-plugins
        run: sbt "sbtUniCrossProject/publishLocal; sbtUniCrossProject/scripted"
  test_sbt_uni_javadoc:
    name: sbt-uni-javadoc scripted test
    needs: changes
    if: ${{ needs.changes.outputs.src == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: sbt
      - uses: ./.github/actions/sbt-launcher
      - name: Install sbt
        uses: sbt/setup-sbt@v1
      # The scripted tests run Scaladoc for Scala 3 and Scala 2.13 projects and check the jars
      - name: Build and scripted-test the plugin
        working-directory: sbt-plugins
        run: sbt "sbtUniJavadoc/publishLocal; sbtUniJavadoc/scripted"
