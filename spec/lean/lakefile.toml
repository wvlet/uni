name = "uni-spec"
defaultTargets = ["UniSpec", "Check", "gen-rx-cases", "gen-msgpack-cases", "gen-rx-nested-cases", "gen-http-reader-cases", "gen-rx-live-cases", "gen-dom-render-cases", "gen-rx-r3-cases", "http-reader-oracle"]

[[lean_lib]]
name = "UniSpec"

# The proof gate (Check.lean): fails the build on sorry, native_decide, or an axiom
[[lean_lib]]
name = "Check"

[[lean_exe]]
name = "gen-rx-cases"
root = "GenRxCases"

[[lean_exe]]
name = "gen-msgpack-cases"
root = "GenMsgPackCases"

[[lean_exe]]
name = "gen-rx-nested-cases"
root = "GenRxNestedCases"


[[lean_exe]]
name = "gen-http-reader-cases"
root = "GenHttpReaderCases"

[[lean_exe]]
name = "gen-rx-live-cases"
root = "GenRxLiveCases"

[[lean_exe]]
name = "gen-dom-render-cases"
root = "GenDomRenderCases"

[[lean_exe]]
name = "gen-rx-r3-cases"
root = "GenRxR3Cases"

# A fuzz oracle, not a generator: HttpReaderFuzzTest sends it inputs and compares outcomes
[[lean_exe]]
name = "http-reader-oracle"
root = "HttpReaderOracle"
