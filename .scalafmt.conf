version = 3.11.5
project.layout = StandardConvention
runner.dialect = scala3
maxColumn = 100
style = defaultWithAlign
docstrings.blankFirstLine = yes
rewrite.scala3.convertToNewSyntax = true
rewrite.scala3.removeOptionalBraces = yes
rewrite.scala3.insertEndMarkerMinLines = 30
# Add a new line before case class
newlines.topLevelStatementBlankLines = [
  {
    blanks { after = 1 }
  }
]
newlines.source = unfold

fileOverride {
  // The crossProject macro (sbt-plugins/sbt-uni-crossproject) mixes inline/quote splices;
  // optional-brace removal and unfolding both misbehave on macro code, so keep braces and folding.
  "glob:**/CrossProjectMacro.scala" {
    rewrite.scala3.removeOptionalBraces = no
    newlines.source = fold
  }
  // sbt 2.x build files are Scala 3
  "glob:**.sbt" {
    runner.dialect = scala3
  }
 "glob:**/uni/**/SourceCode.scala" {
     // optional brace didn't work for code with inline/macro methods
     rewrite.scala3.removeOptionalBraces = no
     // For macros, we need to keep the folding
     newlines.source = fold
  }
}
